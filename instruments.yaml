# Instrument definitions. Add or remove pairs here; `--all` scans every entry.
#
# pip_size        price change of one pip (0.0001, 0.01 for JPY, 0.1 for gold)
# price_decimals  quote precision
# contract_size   units per standard lot (100 oz for gold)
# spread_pips / slippage_pips   cost assumptions for the backtest and R:R
# sessions        liquid windows in which new entries are allowed
# round_steps     psychological levels [major, minor]
# pip_value_usd   fallback USD pip value per lot when no conversion rate is cached
# symbols per source: dukascopy / yfinance / oanda / twelvedata
# dukascopy_point  price divisor for raw Dukascopy bi5 files

EURUSD:
  base: EUR
  quote: USD
  pip_size: 0.0001
  price_decimals: 5
  contract_size: 100000
  spread_pips: 0.8
  slippage_pips: 0.2
  sessions: [london, overlap]
  round_steps: [0.01, 0.005]
  pip_value_usd: 10.0
  dukascopy: EUR/USD
  dukascopy_point: 100000
  yfinance: EURUSD=X
  oanda: EUR_USD
  twelvedata: EUR/USD

